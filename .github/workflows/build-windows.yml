name: Build Windows EXE

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # A closed PR is not necessarily merged; manual runs build the selected branch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that landed on the base branch, whether merged, squashed or rebased.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test and publish
        run: ./build.ps1 -SkipDeliveryCopy

      - name: Name EXE by version and commit
        id: exe
        run: |
          $version = dotnet msbuild src/AudioFromWhatDevice/AudioFromWhatDevice.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not read the project version.' }
          $path = "artifacts/upload/AudioFromWhatDevice-$version-win-x64-$(git rev-parse --short=7 HEAD).exe"
          New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
          Copy-Item artifacts/publish/win-x64/AudioFromWhatDevice.exe $path
          "path=$path" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.exe.outputs.path }}
          # Upload the .exe itself instead of a zip; the artifact takes the file name.
          archive: false
          if-no-files-found: error
